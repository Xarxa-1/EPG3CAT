name: Actualitza EPG XML

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Configuració de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar fitxer EPG
        run: python main.py

      - name: Fer Commit i Push de l'EPG actualitzat
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: actualització automàtica EPG [skip ci]" && git push)
